name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The BEIR zips of the six datasets; scripts/data.sh checks them against
      # scripts/data.sha256 whether restored or downloaded.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/data/*.zip
          key: beir-six-${{ hashFiles('scripts/data.sha256') }}
      # Download, index, rank and evaluate the six datasets; fails if a run
      # file's SHA-256, a trec_eval comparison or the tables differ.
      - run: make reproduce DATA="$RUNNER_TEMP/data"

  dense:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATASETS: nfcorpus
      DENSE_DATASETS: nfcorpus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The BEIR zips of DATASETS; scripts/data.sh checks them against
      # scripts/data.sha256 whether restored or downloaded.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/data/*.zip
          key: beir-${{ env.DATASETS }}-${{ hashFiles('scripts/data.sha256') }}
      - run: make data trec-eval dense-assets DATA="$RUNNER_TEMP/data"
      # The encoder against Anserini's reference query vectors.
      - run: go test ./internal/dense/
        env:
          RL_MODEL_DIR: ${{ runner.temp }}/data/dense
          RL_ORT_LIB: ${{ runner.temp }}/data/dense/onnxruntime-linux-x64-1.31.1/lib/libonnxruntime.so.1.31.1
          RL_REQUIRE_MODEL: "1"
      # Encode, search exactly and on the HNSW graph, check every run against
      # trec_eval; then fail if nDCG@10 is more than 0.005 from the anchor or
      # a document vector's cosine to Pyserini's is below 0.9999 (D012).
      # Exact values depend on the CPU.
      - run: make embed ann dense-check DATA="$RUNNER_TEMP/data"
      # Fuse NFCorpus's BM25 and BGE runs and check them against trec_eval.
      - run: make bm25 fuse DATA="$RUNNER_TEMP/data"

  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
      - run: pip install -r encode/requirements.txt
      # SciFact's zip, checked by scripts/data.sh as above.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/data/*.zip
          key: beir-scifact-${{ hashFiles('scripts/data.sha256') }}
      - run: scripts/data.sh "$RUNNER_TEMP/data" scifact
      # The encoding script on all-MiniLM-L6-v2 at its registered revision,
      # on the CPU: output layout, ID order, resumption, prompts, settings.
      # The step-4 job: order, cut rule, checks, resumption, and its dry run
      # on SciFact, killed and resumed; the report of its files in the log.
      - run: python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest"
        working-directory: encode
        env:
          RL_SCIFACT_DATA: ${{ runner.temp }}/data
      # The step-5 job: check 3's classes, the exact comparison with the
      # anchors, the anchors file.
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: step5
      # The test of the log route: its files at full size, their check, a
      # truncated or changed log, the start command in its dry run.
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: scripts
      # How many of the dry run's CPU reference files equal step 3's.
      - run: python -c 'import glob, json, sys; [print(json.load(open(p))["reference"]) for p in glob.glob(sys.argv[1] + "/*/a/step4/out/summary.json")]' "$RUNNER_TEMP/pytest"

  step6:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATASETS: nfcorpus
      DENSE_DATASETS: nfcorpus
    steps:
      # The whole history: the job compares the code of step 2 with bd072df's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: pip install pytest
      # The BEIR zips of DATASETS; scripts/data.sh checks them against
      # scripts/data.sha256 whether restored or downloaded.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/data/*.zip
          key: beir-${{ env.DATASETS }}-${{ hashFiles('scripts/data.sha256') }}
      - run: make data trec-eval dense-assets DATA="$RUNNER_TEMP/data"
      - run: go build -o "$RUNNER_TEMP/bin/" ./cmd/dense ./cmd/eval ./cmd/fuse ./cmd/bm25 ./cmd/study ./cmd/embed
      # The step-6 job on synthetic worlds with the real binaries: the work
      # list, layout and collect, records and resumption, the canary, the
      # checks of inputs, environment and tags, space, memory, signal 9, the
      # deadline, a log free of measures, the report, the start command.
      - run: python -m pytest -q -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest" test_job.py
        working-directory: step6
        env:
          RL_STEP6_BIN: ${{ runner.temp }}/bin
          RL_TREC_EVAL: ${{ runner.temp }}/data/trec_eval/trec_eval
      # The dry run: NFCorpus's documents encoded as CI encodes them, its dev
      # qrels in place of its test qrels; the start command stopped once
      # after three builds and run again to the end.
      - run: make embed DATA="$RUNNER_TEMP/data"
      - run: python step6/dryrun.py prepare --data "$RUNNER_TEMP/data" --bin "$RUNNER_TEMP/bin" --out "$RUNNER_TEMP/dry"
      - run: python step6/dryrun.py run --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/dry" --commit "$GITHUB_SHA" --stop-after 3
      - run: python step6/dryrun.py run --data "$RUNNER_TEMP/data" --out "$RUNNER_TEMP/dry" --commit "$GITHUB_SHA"
      - run: python -m pytest -q -p no:cacheprovider test_dryrun.py
        working-directory: step6
        env:
          RL_STEP6_DRYRUN: ${{ runner.temp }}/dry
          RL_STEP6_DATA: ${{ runner.temp }}/data
      # The carry printer over the dry run's manifest: every file printed in
      # chunks into a log file, then rebuilt from it and checked against the
      # manifest; the check prints counts, names, sizes and SHA-256 only.
      - run: python scripts/carry6.py print --out "$RUNNER_TEMP/dry/vol/step6/out" --chunk-kib 64 --pause 0 --lead-s 0 --grace-min 0 > "$RUNNER_TEMP/carry.log"
      - run: python scripts/carry6.py check "$RUNNER_TEMP/carry.log" --dir "$RUNNER_TEMP/carry"
