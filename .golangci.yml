version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - unconvert
  settings:
    errcheck:
      # Also report errors assigned to _; an ignored error needs a //nolint with its reason.
      check-blank: true
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sHyanorn/retrieval-lab
